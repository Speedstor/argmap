# Test every change, and keep a digest of the repository on the digest branch.
#
# On a pull request into main: type-check, run the tests, build the digest to
# prove it still builds, and run "argmap verify" on the commits the pull request
# adds, using the checker from main. Nothing is published.
#
# In the public repository, which holds the tool only, the run also fails when
# a file sits under arguments/ or claims/. A copy skips that check.
#
# On a push to main the pushed commits are verified as well, with the checker
# and the trusted keys from before the push.
#
# On a push to main, or when run by hand: the same, then write the digest to the
# digest branch. That branch holds generated Markdown only: one commit, replaced
# each time, never merged. A model starting a session can read it without
# cloning or installing anything. Like the notepads, it is outside the signing
# rule, because nothing on it is a source.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # verify redoes merges and reads allowed_signers from main, so it needs the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The public repository is the tool only. Arguments and claims belong in a
      # copy, so a file under arguments/ or claims/ here is most likely thinking
      # that was meant to stay somewhere else. This is an alarm and not a lock: by
      # the time it runs, the branch has already been pushed. A copy skips it,
      # because a copy is where those files go. It tells itself apart the way the
      # update workflow does.
      - name: Keep arguments and claims out of the tool's repository
        if: github.repository == (vars.ARGMAP_UPSTREAM || 'Speedstor/argmap')
        run: |
          found=$(git ls-files -- arguments claims)
          if [ -n "$found" ]; then
            echo "::error::This repository holds the tool only. These belong in a copy: $(echo $found)"
            exit 1
          fi
      - name: Build the digest
        run: node bin/argmap.mjs digest -o _digest
      # Every commit the pull request adds must be signed by a listed key, in the
      # signer's own name. A prediction and its outcome may not arrive in the same
      # pull request: the prediction has to be on main before anyone looks.
      #
      # The checker is taken from main, not from the pull request, so a pull request
      # cannot rewrite the rules it is judged by. The list of trusted keys is read
      # from main as well. This workflow file itself does come from the pull
      # request: GitHub offers no other way in a public repository. So a pull
      # request that changes .github/, src/verify.ts or allowed_signers deserves a
      # look before it is merged, and the last step says so.
      - name: Check signatures and that each guess came first, with the checker from main
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          git worktree add -q ../checker "$base"
          (cd ../checker && npm ci --silent)
          node ../checker/bin/argmap.mjs verify "$base..${{ github.event.pull_request.head.sha }}" --pull-request
      - name: Say when a pull request changes the checker itself
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }}" -- .github src/verify.ts src/sign.ts allowed_signers)
          if [ -n "$changed" ]; then
            echo "::warning::This pull request changes what checks pull requests. Read these before merging: $(echo $changed)"
          fi
      # A push to main is checked too, with the checker and the list of trusted keys
      # as they were before the push. It cannot stop a push; it turns the commit red.
      - name: Check the commits that reached main, with the checker from before the push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          before="${{ github.event.before }}"
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "::warning::The commit main pointed at before this push is gone, so main was rewritten. Nothing can be checked against it."
            exit 1
          fi
          git worktree add -q ../checker "$before"
          git show "$before:allowed_signers" > ../signers-before
          # Once only: a checker from before version 0.4 fails every merged pull request, because it does not
          # know that a merge can add nothing of its own. For the push that brings 0.4 in, use the new checker.
          if grep -q mergeKind ../checker/src/verify.ts; then
            (cd ../checker && npm ci --silent)
            node ../checker/bin/argmap.mjs verify "$before..${{ github.sha }}" --signers ../signers-before
          else
            node bin/argmap.mjs verify "$before..${{ github.sha }}" --signers ../signers-before
          fi

  digest:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The digest says whether the history passes verify, so it needs the whole history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the digest
        run: node bin/argmap.mjs digest -o _digest
      - name: Replace the digest branch
        working-directory: _digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b digest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Digest of ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" digest
