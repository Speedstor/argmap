# Test every change, and keep a digest of the repository on the digest branch.
#
# On a pull request into main: type-check, run the tests, and build the digest
# to prove it still builds. Nothing is published.
#
# On a push to main, or when run by hand: the same, then write the digest to the
# digest branch. That branch holds generated Markdown only: one commit, replaced
# each time, never merged. A model starting a session can read it without
# cloning or installing anything. Like the notepads, it is outside the signing
# rule, because nothing on it is a source.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the digest
        run: node bin/argmap.mjs digest -o _digest

  digest:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the digest
        run: node bin/argmap.mjs digest -o _digest
      - name: Replace the digest branch
        working-directory: _digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b digest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Digest of ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" digest
