# Remind people of predictions that have come due.
#
# Once a day this lists the open predictions whose due date has passed and
# opens one issue for each, unless an issue with the same title is already
# open. GitHub then notifies whoever watches the repository. The job writes
# nothing to the repository, so it needs no signing key.
#
# GitHub switches scheduled workflows off after 60 days without activity in a
# repository. Run it by hand from the Actions tab to switch it back on.
name: Predictions due

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  due:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Open an issue for each prediction that has come due
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/due-issues.mjs
